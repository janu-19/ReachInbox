version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: email-scheduler-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: email_scheduler
      MYSQL_USER: scheduler_user
      MYSQL_PASSWORD: scheduler_password_123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: email-scheduler-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: email-scheduler-backend
    restart: always
    depends_on:
      - mysql
      - redis
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5001
      - NODE_ENV=development
      - DATABASE_URL=mysql://scheduler_user:scheduler_password_123@mysql:3306/email_scheduler
      - REDIS_URL=redis://redis:6379

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: email-scheduler-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  redis_data:
